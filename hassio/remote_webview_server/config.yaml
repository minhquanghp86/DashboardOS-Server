name: "Dashboard OS Server"
version: "2.9.324"
slug: "remote_webview_server"
# (02/10/2026) Anh dung san tren ghcr (CI tag = version). Truoc day addon build tai may HA tu build.yaml + Dockerfile,
# va Supervisor xuat ca anh Docker (~1,1 GB sau nen) vao moi ban sao luu; anh keo ve thi khong. build.yaml/Dockerfile
# giu lai lam cong thuc cho CI (.github/workflows/release-docker.yml, buoc "Build & Push addon image").
image: "ghcr.io/minhquanghp86/dashboardos-server"
description: "Truyền bảng điều khiển HA hoặc bất kỳ trang web nào tới màn hình hiển thị dựa trên ESP32 dưới dạng ô thông qua WebSocket."
url: "https://github.com/minhquanghp86/DashboardOS-Server/tree/main/hassio/remote_webview_server"
# Chi amd64: image dua tren Google Chrome (H.264) — Chrome cho Linux chi co ban amd64.
arch:
  - amd64
startup: application
boot: auto

host_network: true
# (25/09/2026) Doc vi tri nha (/api/config) cho ung dung Thoi tiet cua launcher — xem src/haLocation.ts.
homeassistant_api: true
# (25/09/2026) Trang "Menu panel" tren thanh ben HA: cau hinh menu ung dung cua panel (an/hien, thu tu, bieu tuong MDI,
# mau, them ung dung). Ingress buoc dang nhap HA; server chi cho LUU tu dia chi ingress (src/launcherApi.ts).
ingress: true
ingress_port: 18080
# (22/10/2026) Mo them cong truc tiep tren LAN/Tailscale: trang Dieu khien (control.html) can
# WebSocket lien tuc — qua ingress HA thi WS bi dong sau vai khung va MJPEG bi dem -> trang phai
# polling va bi 429. Vao thang http://<ip-ha>:18080/... thi WS chay ~18 fps.
# (21/11/2026) GD13 — 18443/tcp: HTTPS TU KY cua chinh add-on (src/tls.ts). App Android can https de WebView duoc cap
# micro/camera; truoc day phai qua ingress HA (chi chay khi HA frontend da mo panel mot lan). Nay dien thoai chi can
# https://<ip-ha>:18443/launcher-config.html — KHONG can dang nhap HA. Chung chi sinh mot lan trong /data/tls (ben qua
# update add-on), SAN gom moi IPv4 cua may + localhost + hostname; het han/doi IP thi tu sinh lai.
# 18080 GIU NGUYEN: man hinh ESP32 va cac trang trong LAN dang dung 18080.
ports:
  18080/tcp: 18080
  18443/tcp: 18443
ingress_entry: launcher-config.html
# (01/10/2026) Trang thanh ben gio co hai the: Tin nhan (noi bo voi cac man hinh) + Menu ung dung -> ten "Dashboard".
panel_icon: mdi:tablet-dashboard
panel_title: Dashboard

video: true
udev: true
init: false

watchdog: "http://[HOST]:[PORT:18080]/"

map:
  - type: addon_config
    read_only: false
  # (27/09/2026) Ung dung Khung anh doc anh trong thu muc media cua HA (/media/photos) — chi doc.
  - type: media
    read_only: true

# (02/10/2026) Khong dua bo dem vao ban sao luu HA: bo dem dia cua Chrome (~1,6 GB), mo hinh tai ve, ban MP4 tai ve va
# tep tai len tam cua Quan ly file — deu tu tao lai. Ho so Chrome that (dang nhap, Local Storage, IndexedDB, Service
# Worker) van duoc sao luu. Supervisor so khop tu ben phai duong dan (PurePath.match) nen dung voi moi user_data_dir.
backup_exclude:
  - "*/Default/Cache"
  - "*/Default/Code Cache"
  - "*/Default/GPUCache"
  - "*/Default/DawnWebGPUCache"
  - "*/Default/DawnGraphiteCache"
  - "*/GrShaderCache"
  - "*/GraphiteDawnCache"
  - "*/ShaderCache"
  - "*/optimization_guide_model_store"
  - "*/fm-mp4"
  - "*/fm-tmp"

options:
  browser_locale: "en-US"
  tile_size: 32
  full_frame_tile_count: 4
  full_frame_area_threshold: 0.5
  full_frame_every: 50
  every_nth_frame: 1
  min_frame_interval_ms: 80
  jpeg_quality: 85
  max_bytes_per_message: 61440
  ws_port: 8081
  debug_port: 9221
  expose_debug_proxy: false
  debug_proxy_port: 9222
  health_port: 18080
  # (21/11/2026) GD13 — cong HTTPS tu ky (0 = tat). Doi cong thi phai sua ca app Android (Cài đặt → địa chỉ IP vẫn
  # dò được, nhưng app ưu tiên đúng 18443; đổi chỉ nên làm khi 18443 bị chiếm).
  https_port: 18443
  prefers_reduced_motion: false
  screensaver_idle_s: 120
  screensaver_photos: true
  morning_briefing: true
  morning_window: "06:00-09:30"
  morning_tts: false
  gphotos_album: ""
  cast_enabled: true
  dial_port: 56790
  # (31/10/2026) AGC + limiter cho tieng dien thoai -> loa man P4 (src/audioAgc.ts): dua muc am luong ve -18 dBFS
  # roi chan dinh -1 dBFS. false = tat han (A/B, nghe lai dung nhu cu).
  call_agc: true
  # (06/12/2026) MONO -> STEREO (L = R) cho nhanh xuong LOA MAN P4 (src/audioStereo.ts): mixer cua P4 khai 2 kenh
  # nen moi goi 20 ms phai la 1280 B (truoc day 640 B mono chi la 10 ms stereo -> buffer loa luon day -> vut -> dut
  # quang). false = gui mono 640 B nhu cu (A/B tren cung mot tep mau).
  call_stereo: true
  # (07/12/2026) HA MAU 16 kHz -> 8 kHz (src/audioResample8k.ts): 640 B -> 320 B/20 ms, chong alias bang Butterworth
  # bac 6. (08/12/2026) MAC DINH false (16 kHz) — phep do tren P4 cho thay loa tieu thu dung 16 kHz; nguyen nhan
  # "dut quang" that su la bo dem nhip phat 2 goi/20 ms (da sua trong src/audioPacer.ts), khong phai tan so lay mau.
  call_rate8k: false
  # (13/12/2026) CHONG RU (howling) bang HALF-DUPLEX THICH NGHI (voice switch, src/audioDuplex.ts): do nang luong 2
  # chieu cua tung cuoc goi roi cat 20 dB chieu "man -> dien thoai" khi dien thoai dang noi va cat 12 dB chieu
  # "dien thoai -> loa man" khi tieng trong phong dang hon (nguong -34 dBFS, hon 6 dB, attack 10 ms / release 250 ms).
  # Da chan duoc vong lap nen AGC duoc phep to hon: muc nham -14 dBFS, gain toi da +24 dB (truoc la -16 / +12).
  # false = tat han de A/B tren cung mot cuoc goi (AGC tro ve -16 dBFS / +12 dB).
  call_halfduplex: true
  # (23/09/2026) /pw-data KHONG nam trong volume ben cua addon — mat het khi
  # container tao lai (moi lan update). /data la thu muc rieng cua addon nay
  # do Supervisor tu cap, LUON ben qua update/restart.
  user_data_dir: "/data/pw-data"

schema:
  browser_locale: str
  tile_size: int
  full_frame_tile_count: int
  full_frame_area_threshold: float
  full_frame_every: int
  every_nth_frame: int
  min_frame_interval_ms: int
  jpeg_quality: int
  max_bytes_per_message: int
  ws_port: int
  debug_port: int
  expose_debug_proxy: bool
  debug_proxy_port: int
  health_port: int
  https_port: "port?"
  prefers_reduced_motion: bool
  screensaver_idle_s: "int(0,)?"
  screensaver_photos: "bool?"
  morning_briefing: "bool?"
  morning_window: "match(^\\d{1,2}:\\d{2}-\\d{1,2}:\\d{2}$)?"
  morning_tts: "bool?"
  gphotos_album: "str?"
  cast_enabled: "bool?"
  dial_port: "port?"
  call_agc: "bool?"
  call_stereo: "bool?"
  # (08/12/2026) Thieu khai bao nay thi Supervisor coi `call_rate8k` la option la (khong bat/tat duoc tren giao dien).
  call_rate8k: "bool?"
  # (13/12/2026) HALF-DUPLEX chong RU (src/audioDuplex.ts) — bat/tat duoc tren giao dien Cau hinh.
  call_halfduplex: "bool?"
  user_data_dir: str
